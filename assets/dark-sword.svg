 <style><![CDATA[
 .star{animation:twinkle 3.4s ease-in-out infinite alternate}
 .fog{animation:fog 9s ease-in-out infinite alternate}
 .moon{animation:moonlight 5s ease-in-out infinite}
 .torch{animation:torch 1.5s ease-in-out infinite alternate}
 .blade{animation:float 4.2s ease-in-out infinite;transform-origin:600px 171px}
 .aura{animation:glow 2.2s ease-in-out infinite alternate}
 .spark{animation:sparks 3.6s ease-in-out infinite}
 .rune{animation:twinkle 2.5s ease-in-out infinite alternate}
 .flash{animation:sweep 5s ease-in-out infinite}
 .cursor{animation:blink 1s steps(1) infinite}
 @keyframes twinkle{from{opacity:.12}to{opacity:.88}}
 @keyframes fog{0%{transform:translateX(-28px)}100%{transform:translateX(36px)}}
 @keyframes moonlight{0%,100%{opacity:.53}50%{opacity:.9}}
 @keyframes torch{to{opacity:.35}}
 @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-11px) rotate(2deg)}}
 @keyframes glow{from{opacity:.22}to{opacity:.85}}
 @keyframes sparks{0%{opacity:0;transform:translateY(15px)}25%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
 @keyframes sweep{0%,18%{transform:translateX(-330px);opacity:0}35%{opacity:.95}75%,100%{transform:translateX(660px);opacity:0}}
 @keyframes blink{50%{opacity:0}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 ]]></style>
