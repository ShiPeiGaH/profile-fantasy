<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Animated medieval dark fantasy sword glowing above a shadowy castle and moon">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06070f"/><stop offset=".54" stop-color="#140f24"/><stop offset="1" stop-color="#090d18"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#fff5ed"/><stop offset=".4" stop-color="#d4b4d9"/><stop offset="1" stop-color="#6b4c84"/></radialGradient>
 <linearGradient id="steel" x1="0" x2="1"><stop stop-color="#56637d"/><stop offset=".35" stop-color="#eef4ff"/><stop offset=".75" stop-color="#a78bfa"/><stop offset="1" stop-color="#e9d5ff"/></linearGradient>
