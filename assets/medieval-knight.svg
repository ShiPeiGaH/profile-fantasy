<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="Animated medieval dark knight of code wearing gothic armor with a glowing sword, red moon and flickering torches">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0e16"/><stop offset=".56" stop-color="#14121f"/><stop offset="1" stop-color="#261820"/></linearGradient>
<linearGradient id="parchment" x1="0" y1="0" x2="1"><stop stop-color="#e0cba8"/><stop offset=".5" stop-color="#f7e7ce"/><stop offset="1" stop-color="#bfa88a"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#283040"/><stop offset=".3" stop-color="#778198"/><stop offset=".6" stop-color="#373b4f"/><stop offset="1" stop-color="#171c2a"/></linearGradient>
<linearGradient id="blade" x1="0" y1="0" x2="1"><stop stop-color="#c7b1bb"/><stop offset=".5" stop-color="#f7e3d2"/><stop offset="1" stop-color="#6b859e"/></linearGradient>
<radialGradient id="ember"><stop stop-color="#ffd3a2"/><stop offset=".55" stop-color="#ce6945"/><stop offset="1" stop-color="#8c293a"/></radialGradient>
<filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
<clipPath id="cl"><rect x="9" y="9" width="1182" height="432" rx="10"/></clipPath>
<style><![CDATA[
.torch{animation:fire 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
.eye{animation:eye 2.8s ease-in-out infinite alternate}
.cloak{animation:cloak 3s ease-in-out infinite alternate;transform-origin:930px 216px}
.sword{animation:sword 4s ease-in-out infinite;transform-origin:1014px 360px}
.smoke{animation:smoke 5s ease-in-out infinite alternate}
.rune{animation:rune 3.1s ease-in-out infinite alternate}
.glow{animation:eye 2.8s ease-in-out infinite alternate}
.sparks{animation:sparks 3s ease-in-out infinite}
@keyframes fire{0%{transform:scale(.88,1.05) rotate(-5deg);opacity:.6}100%{transform:scale(1.18,.9) rotate(5deg);opacity:1}}
@keyframes eye{to{opacity:.15}}
@keyframes cloak{to{transform:rotate(-2deg) translateX(-9px)}}
@keyframes sword{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes smoke{to{transform:translateY(-30px) translateX(17px);opacity:.05}}
@keyframes rune{to{opacity:.9;transform:translateY(-5px)}}
@keyframes sparks{0%{opacity:0;transform:translateY(7px)}30%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
]]></style>
</defs>
